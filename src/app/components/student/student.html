<section class="student-page">
	<div class="student-page-header">
		<div>
			<h3>Students</h3>
			<p>Manage student records and enrolment information.</p>
		</div>
		<button class="btn btn-primary" (click)="onOpenAdd()"><i class="bi bi-plus-lg"></i>Add Student</button>
	</div>

	<app-base-table
		[title]="'All students'"
		[columns]="columns"
		[rows]="students"
		[showRowNumber]="true"
		emptyMessage="No student records found.">
	</app-base-table>
</section>

<app-add-data-modal
  entity="Student"
  [visible]="showAdd"
  [fields]="studentFields"
  (close)="onCloseAdd()"
  (save)="onSaveItem($event)">
</app-add-data-modal>
