<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="mb-1 fw-bold">Score Management</h3>
      <p class="text-muted mb-0">Select a class to manage student scores.</p>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && classes.length === 0" class="alert alert-info border-0 rounded-4 shadow-sm">
    No classes found.
  </div>

  <div *ngIf="!loading && classes.length > 0" class="row g-4">
    <div class="col-12 col-md-6 col-xl-4" *ngFor="let cls of classes">
      <div class="card p-4 h-100 shadow-sm border-0 class-card" (click)="goToClass(cls.id || cls['classId'])" style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div class="icon-box bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            <i class="bi bi-building fs-4"></i>
          </div>
          <span class="badge bg-soft text-primary border border-primary px-3 py-2 rounded-pill">View Class</span>
        </div>
        <h5 class="fw-bold mb-1">{{ cls.className || cls.name || 'Unnamed Class' }}</h5>
        <p class="text-muted small mb-0">{{ cls.description || 'Manage student scores for this class' }}</p>
      </div>
    </div>
  </div>
</div>
