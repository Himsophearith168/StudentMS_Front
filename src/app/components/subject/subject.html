<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="mb-1 fw-bold">Subjects</h3>
      <p class="text-muted mb-0">Manage all subjects offered this semester.</p>
    </div>
    <button class="btn btn-primary btn-soft px-4 rounded-pill shadow-sm"><i class="bi bi-plus-lg me-2"></i>Add Subject</button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading && subjects.length === 0" class="alert alert-info border-0 rounded-4 shadow-sm">
    No subjects found.
  </div>

  <div *ngIf="!loading && subjects.length > 0" class="card shadow-sm border-0 bg-white overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-uppercase small text-muted">
          <tr>
            <th class="ps-4">No</th>
            <th>Subject Name</th>
            <th>Description</th>
            <th>Semester</th>
            <th class="text-end pe-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let subj of subjects; let i = index">
            <td class="ps-4 text-muted">{{ i + 1 }}</td>
            <td class="fw-bold">{{ subj.subjectName || subj['name'] || 'Unnamed' }}</td>
            <td class="text-muted text-truncate" style="max-width: 200px;">{{ subj.subjectDescription || subj['description'] || 'No description' }}</td>
            <td>
              <span class="badge bg-light text-dark border">{{ subj.semester || 'N/A' }}</span>
            </td>
            <td class="text-end pe-4">
              <button class="btn btn-sm btn-outline-secondary rounded-circle me-2" style="width: 32px; height: 32px; padding: 0;"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger rounded-circle" style="width: 32px; height: 32px; padding: 0;"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
