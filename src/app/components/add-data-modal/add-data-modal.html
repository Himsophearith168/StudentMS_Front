<!-- Backdrop with fade animation class -->
<div class="modal-overlay" [class.active]="visible" *ngIf="visible" (click)="onBackdropClick($event)">
  
  <!-- Dialog with scale animation class -->
  <div class="modal-dialog" [class.active]="visible">
    
    <div class="modal-header">
      <div class="d-flex align-items-center gap-3">
        <div class="modal-icon-wrapper">
          <i class="bi bi-plus-lg"></i>
        </div>
        <h5 class="modal-title mb-0">Add New {{ entity }}</h5>
      </div>
      <button type="button" class="btn-close-custom" aria-label="Close" (click)="onClose()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body">
      <ng-container *ngFor="let field of fields">
        <div class="mb-4" *ngIf="field.type !== 'textarea'">
          <label class="form-label fw-semibold text-dark">
            {{ field.label }}
            <span class="text-danger" *ngIf="field.required">*</span>
          </label>
          <ng-container [ngSwitch]="field.type">
            <input
              *ngSwitchCase="'text'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              type="text"
            />
            <input
              *ngSwitchCase="'number'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              type="number"
            />
            <input
              *ngSwitchCase="'email'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              type="email"
            />
            <input
              *ngSwitchCase="'date'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              type="date"
            />
            <select
              *ngSwitchCase="'select'"
              class="form-select custom-input"
              [(ngModel)]="form[field.key]"
            >
              <option value="" disabled>{{ field.placeholder || 'Select an option' }}</option>
              <option *ngFor="let option of field.options" [value]="option.value">{{ option.label }}</option>
            </select>
          </ng-container>
        </div>

        <div class="mb-4" *ngIf="field.type === 'textarea'">
          <label class="form-label fw-semibold text-dark">
            {{ field.label }}
            <span class="text-danger" *ngIf="field.required">*</span>
          </label>
          <textarea
            class="form-control custom-input"
            [(ngModel)]="form[field.key]"
            [placeholder]="field.placeholder || ''"
            rows="4"
          ></textarea>
        </div>
      </ng-container>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" (click)="onClose()">Cancel</button>
      <button class="btn btn-save" (click)="onSave()" [disabled]="isSaveDisabled">
        <i class="bi bi-check-lg me-1"></i> Save {{ entity }}
      </button>
    </div>
  </div>
</div>
