<!-- Backdrop with fade animation class -->
<div class="modal-overlay" [class.active]="visible" *ngIf="visible" (click)="onBackdropClick($event)">
  
  <!-- Dialog with scale animation class -->
  <div class="modal-dialog" [class.active]="visible">
    
    <div class="modal-header">
      <div class="d-flex align-items-center gap-3">
        <div class="modal-icon-wrapper">
          <img *ngIf="iconSrc" [src]="iconSrc" [alt]="iconAlt || entity" class="modal-icon-img" />
          <i *ngIf="!iconSrc && iconClass" [class]="iconClass"></i>
          <i *ngIf="!iconSrc && !iconClass" [ngClass]="{ 'bi-plus-lg': mode==='create', 'bi-pencil-square': mode==='edit', 'bi-eye-fill': mode==='view' }" class="bi"></i>
        </div>
        <h5 class="modal-title mb-0">
          <span *ngIf="mode === 'create'">Add New {{ entity }}</span>
          <span *ngIf="mode === 'edit'">Edit {{ entity }}</span>
          <span *ngIf="mode === 'view'">View {{ entity }}</span>
        </h5>
      </div>
      <button type="button" class="btn-close-custom" aria-label="Close" (click)="onClose()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="modal-body">
          <ng-container *ngFor="let field of fields">
        <div class="mb-4" *ngIf="field.type !== 'textarea'">
          <label class="form-label fw-semibold text-dark">
            {{ field.label }}
            <span class="text-danger" *ngIf="field.required">*</span>
          </label>
          <ng-container [ngSwitch]="field.type">
            <input
              *ngSwitchCase="'text'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              [disabled]="mode === 'view'"
              type="text"
            />
            <input
              *ngSwitchCase="'number'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              [disabled]="mode === 'view'"
              type="number"
            />
            <input
              *ngSwitchCase="'email'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              [disabled]="mode === 'view'"
              type="email"
            />
            <input
              *ngSwitchCase="'date'"
              class="form-control custom-input"
              [(ngModel)]="form[field.key]"
              [placeholder]="field.placeholder || ''"
              [disabled]="mode === 'view'"
              type="date"
            />
            <select
              *ngSwitchCase="'select'"
              class="form-select custom-input"
              [(ngModel)]="form[field.key]"
              [disabled]="mode === 'view'"
            >
              <option value="" disabled>{{ field.placeholder || 'Select an option' }}</option>
              <option *ngFor="let option of field.options" [value]="option.value">{{ option.label }}</option>
            </select>
          </ng-container>
        </div>

        <div class="mb-4" *ngIf="field.type === 'textarea'">
          <label class="form-label fw-semibold text-dark">
            {{ field.label }}
            <span class="text-danger" *ngIf="field.required">*</span>
          </label>
          <textarea
            class="form-control custom-input"
            [(ngModel)]="form[field.key]"
            [placeholder]="field.placeholder || ''"
            [disabled]="mode === 'view'"
            rows="4"
          ></textarea>
        </div>
      </ng-container>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" type="button" (click)="onClose()">
        <i class="bi bi-x-lg me-1" aria-hidden="true"></i>Cancel
      </button>
      <button *ngIf="mode !== 'view'" class="btn btn-save" (click)="onSave()" [disabled]="isSaveDisabled">
        <i class="bi bi-check-lg me-1"></i> Save {{ entity }}
      </button>
    </div>
  </div>
</div>
